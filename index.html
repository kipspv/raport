<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIP Class Link Portal</title>
  <style>
    :root {
      --primary: #1f4e79;
      --primary-dark: #163955;
      --primary-soft: #eaf3fb;
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --danger: #dc2626;
      --success: #16a34a;
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.15);
    }

    [data-theme="dark"] {
      --primary: #60a5fa;
      --primary-dark: #3b82f6;
      --primary-soft: #172554;
      --bg: #0f172a;
      --surface: #111827;
      --surface-2: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: #374151;
      --danger: #f87171;
      --success: #4ade80;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(31, 78, 121, 0.16), transparent 34%),
        radial-gradient(circle at bottom right, rgba(245, 185, 66, 0.12), transparent 30%),
        var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 34px;
      position: relative;
    }

    .theme-button {
      position: absolute;
      top: 18px;
      right: 18px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface-2);
      color: var(--text);
      padding: 8px 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
    }

    .brand {
      display: grid;
      justify-items: center;
      text-align: center;
      margin: 18px 0 30px;
    }

    .logo {
      width: 62px;
      height: 62px;
      border-radius: 19px;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      display: grid;
      place-items: center;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      box-shadow: 0 14px 30px rgba(31, 78, 121, 0.25);
    }

    .brand h1 {
      font-size: 24px;
      letter-spacing: -0.5px;
    }

    .brand p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .form-group {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    label {
      font-size: 13px;
      font-weight: 800;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px 13px;
      color: var(--text);
      background: var(--surface-2);
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(31, 78, 121, 0.13);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 72px;
    }

    .password-toggle {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--primary);
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      padding: 8px;
    }

    .login-button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 13px 15px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 900;
      cursor: pointer;
      transition: 0.18s ease;
      margin-top: 4px;
    }

    .login-button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      display: none;
      padding: 12px 13px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    .alert.show {
      display: block;
    }

    .alert.error {
      color: #991b1b;
      background: #fee2e2;
      border: 1px solid #fecaca;
    }

    .alert.success {
      color: #166534;
      background: #dcfce7;
      border: 1px solid #bbf7d0;
    }

    [data-theme="dark"] .alert.error {
      color: #fecaca;
      background: #451a1a;
      border-color: #7f1d1d;
    }

    [data-theme="dark"] .alert.success {
      color: #bbf7d0;
      background: #14532d;
      border-color: #166534;
    }

    .status {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status.online .status-dot {
      background: var(--success);
    }

    .status.offline .status-dot {
      background: var(--danger);
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .login-card {
        padding: 28px 22px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <button class="theme-button" id="themeButton" type="button">Dark Mode</button>

    <div class="brand">
      <div class="logo">KIP</div>
      <h1>KIP Class Link Portal</h1>
      <p>Sign in to continue</p>
    </div>

    <div class="alert" id="loginAlert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="Enter username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
          <button class="password-toggle" id="passwordToggle" type="button">Show</button>
        </div>
      </div>

      <button class="login-button" id="loginButton" type="submit">Login</button>
    </form>

    <div class="status" id="backendStatus">
      <span class="status-dot"></span>
      <span id="backendStatusText">Checking system...</span>
    </div>
  </main>

  <script>
    const APP_NAME = 'KIP Class Link Portal';
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwv8ytIDE-0EkX8Px-VW2Mtyf6NaVsZWikRXC5D0qbWAgFuxGSaibIfZrDb2iiYwDR_/exec';
    const DASHBOARD_URL = 'Dashboard.html';
    const REQUEST_TIMEOUT_MS = 30000;

    const STORAGE_KEYS = {
      TOKEN: 'kip_class_portal_token',
      USER: 'kip_class_portal_user',
      THEME: 'kip_class_portal_theme'
    };

    document.addEventListener('DOMContentLoaded', function () {
      document.title = APP_NAME;
      initTheme();
      bindEvents();
      checkExistingSession();
      checkBackend();
    });

    function bindEvents() {
      document.getElementById('loginForm').addEventListener('submit', handleLogin);
      document.getElementById('themeButton').addEventListener('click', toggleTheme);
      document.getElementById('passwordToggle').addEventListener('click', togglePassword);
    }

    function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      clearAlert();
      setLoginLoading(true);

      callBackend('login', {
        username: username,
        password: password
      })
        .then(function (response) {
          if (!response || !response.success) {
            showAlert(response && response.message ? response.message : 'Login failed.', 'error');
            return;
          }

          sessionStorage.setItem(STORAGE_KEYS.TOKEN, response.token);
          sessionStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(response.user || {}));
          localStorage.removeItem(STORAGE_KEYS.TOKEN);
          localStorage.removeItem(STORAGE_KEYS.USER);

          showAlert('Login successful. Opening dashboard...', 'success');
          setTimeout(redirectToDashboard, 300);
        })
        .catch(function (error) {
          showAlert(error && error.message ? error.message : 'Unable to connect to the backend.', 'error');
        })
        .finally(function () {
          setLoginLoading(false);
        });
    }

    function checkExistingSession() {
      const token = sessionStorage.getItem(STORAGE_KEYS.TOKEN) || localStorage.getItem(STORAGE_KEYS.TOKEN);
      if (!token) return;

      callBackend('getCurrentUser', { token: token })
        .then(function (response) {
          if (!response || !response.success) {
            clearSession();
            return;
          }

          sessionStorage.setItem(STORAGE_KEYS.TOKEN, token);
          sessionStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(response.user || {}));
          localStorage.removeItem(STORAGE_KEYS.TOKEN);
          localStorage.removeItem(STORAGE_KEYS.USER);
          redirectToDashboard();
        })
        .catch(function () {
          clearSession();
        });
    }

    function checkBackend() {
      callBackend('ping', {})
        .then(function (response) {
          setBackendStatus(Boolean(response && response.success));
        })
        .catch(function () {
          setBackendStatus(false);
        });
    }

    function setBackendStatus(online) {
      const status = document.getElementById('backendStatus');
      status.classList.remove('online', 'offline');
      status.classList.add(online ? 'online' : 'offline');
      document.getElementById('backendStatusText').textContent = online
        ? 'Backend online'
        : 'Backend unavailable';
    }

    function callBackend(action, payload) {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(function (error) {
              reject(new Error(error && error.message ? error.message : String(error)));
            })
            .api(action, payload || {});
        });
      }

      return callGasIframeBridge(action, payload || {});
    }

    function callGasIframeBridge(action, payload) {
      const baseUrl = String(GAS_WEB_APP_URL || '').trim();

      if (!baseUrl || baseUrl.indexOf('script.google.com') === -1) {
        return Promise.reject(new Error('GAS Web App URL is not configured.'));
      }

      return new Promise(function (resolve, reject) {
        const requestId = 'kip_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
        const frameName = 'kip_bridge_' + requestId;
        const iframe = document.createElement('iframe');
        const form = document.createElement('form');
        let settled = false;

        iframe.name = frameName;
        iframe.style.display = 'none';
        iframe.setAttribute('aria-hidden', 'true');

        form.method = 'POST';
        form.action = baseUrl.split('?')[0];
        form.target = frameName;
        form.style.display = 'none';

        appendHiddenField(form, 'transport', 'iframe');
        appendHiddenField(form, 'requestId', requestId);
        appendHiddenField(form, 'targetOrigin', window.location.origin === 'null' ? '*' : window.location.origin);
        appendHiddenField(form, 'action', action);
        appendHiddenField(form, 'payload', JSON.stringify(payload || {}));

        const timeout = setTimeout(function () {
          finish(new Error('Request timeout. Please try again.'));
        }, REQUEST_TIMEOUT_MS);

        function onMessage(event) {
          if (!isTrustedBridgeOrigin(event.origin)) return;

          const data = event.data || {};
          if (data.channel !== 'KIP_GAS_BRIDGE' || data.requestId !== requestId) return;

          finish(null, data.response);
        }

        function finish(error, response) {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          window.removeEventListener('message', onMessage);

          if (form.parentNode) form.parentNode.removeChild(form);
          if (iframe.parentNode) iframe.parentNode.removeChild(iframe);

          if (error) reject(error);
          else resolve(response);
        }

        window.addEventListener('message', onMessage);
        document.body.appendChild(iframe);
        document.body.appendChild(form);
        form.submit();
      });
    }

    function appendHiddenField(form, name, value) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = name;
      input.value = String(value === null || value === undefined ? '' : value);
      form.appendChild(input);
    }

    function isTrustedBridgeOrigin(origin) {
      try {
        const hostname = new URL(origin).hostname.toLowerCase();
        return hostname === 'script.google.com' ||
          hostname === 'script.googleusercontent.com' ||
          hostname.endsWith('.googleusercontent.com');
      } catch (err) {
        return false;
      }
    }

    function redirectToDashboard() {
      window.location.replace(DASHBOARD_URL);
    }

    function togglePassword() {
      const input = document.getElementById('password');
      const button = document.getElementById('passwordToggle');
      const visible = input.type === 'text';
      input.type = visible ? 'password' : 'text';
      button.textContent = visible ? 'Show' : 'Hide';
    }

    function initTheme() {
      const theme = localStorage.getItem(STORAGE_KEYS.THEME) || 'light';
      document.documentElement.setAttribute('data-theme', theme);
      updateThemeButton(theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem(STORAGE_KEYS.THEME, next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      document.getElementById('themeButton').textContent = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
    }

    function showAlert(message, type) {
      const alert = document.getElementById('loginAlert');
      alert.textContent = message;
      alert.className = 'alert show ' + type;
    }

    function clearAlert() {
      const alert = document.getElementById('loginAlert');
      alert.textContent = '';
      alert.className = 'alert';
    }

    function setLoginLoading(loading) {
      const button = document.getElementById('loginButton');
      button.disabled = loading;
      button.textContent = loading ? 'Logging in...' : 'Login';
    }

    function clearSession() {
      sessionStorage.removeItem(STORAGE_KEYS.TOKEN);
      sessionStorage.removeItem(STORAGE_KEYS.USER);
      localStorage.removeItem(STORAGE_KEYS.TOKEN);
      localStorage.removeItem(STORAGE_KEYS.USER);
    }
  </script>
</body>
</html>
